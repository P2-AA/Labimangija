plugins {
  id 'java'
  id 'application'
  id 'org.javamodularity.moduleplugin' version '1.8.12'
  id 'org.openjfx.javafxplugin' version '0.0.14'
  id 'org.beryx.jlink' version '2.25.0'
}

group 'org.example'
version '1.3.1'

repositories {
  mavenCentral()
}

sourceCompatibility = '21'
targetCompatibility = '21'

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

application {
  mainModule = 'ee.ut.labimangija'
  mainClass = 'ee.ut.labimangija.MainApp'
}

javafx {
  version = '21'
  modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
  implementation('org.controlsfx:controlsfx:11.1.2')
  implementation('org.kordamp.ikonli:ikonli-javafx:12.3.1')

  implementation "org.openjfx:javafx-controls:21"
  implementation "org.openjfx:javafx-fxml:21"
  implementation "org.openjfx:javafx-base:21"
}

jlink {
  imageZip = project.file("${buildDir}/distributions/app-${javafx.platform.classifier}.zip")
  options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
  launcher {
    name = 'app'
  }
}

tasks.named('jlink') {
  inputs.dir('sisendid').withPathSensitivity(PathSensitivity.RELATIVE)

  doLast {
    def imageDir = layout.buildDirectory.dir('image').get().asFile
    copy {
      from 'sisendid'
      into new File(imageDir, 'sisendid')
    }
    
    mkdir new File(imageDir, 'labimangud')
  }
}

jlinkZip {
  group = 'distribution'
}
