plugins {
    id 'java'
    id 'application'
    id 'org.javamodularity.moduleplugin' version '2.0.1'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '4.0.2'
}

group 'ee.ut.labimangija'
version '1.3.1'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    mainModule = 'ee.ut.labimangija'
    mainClass = 'ee.ut.labimangija.MainApp'
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    // implementation('org.controlsfx:controlsfx:11.1.2')
    // implementation('org.kordamp.ikonli:ikonli-javafx:12.3.1')

    implementation "org.openjfx:javafx-controls:21"
    implementation "org.openjfx:javafx-fxml:21"
    implementation "org.openjfx:javafx-base:21"
}

jlink {
    imageDir = layout.buildDirectory.dir('Labimangija')
    imageZip = layout.buildDirectory.file("Labimangija-${project.version}-${javafx.platform.classifier}.zip")
    options = ['--strip-debug', '--compress', 'zip-9', '--no-header-files', '--no-man-pages']
    launcher {
        name = '../Labimangija'
        // noConsole = true
    }
}

tasks.named('jlink') {
    doLast {
        // Some string replacement hacks to move launch script to image root
        def launchScriptWin = jlink.imageDir.file('Labimangija.bat').get().asFile
        def launchScriptUnix = jlink.imageDir.file('Labimangija').get().asFile
        if (javafx.platform.classifier == 'win') {
            launchScriptWin.text = launchScriptWin.text.replace('%~dp0', '%~dp0/bin')
            delete launchScriptUnix
        } else {
            launchScriptUnix.text = launchScriptUnix.text.replace('${0%/*}', '${0%/*}/bin')
            delete launchScriptWin
        }
    }
}
